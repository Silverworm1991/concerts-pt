name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build   # type-checks every package
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [api]   # add new services here
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t concerts-${{ matrix.service }} .
