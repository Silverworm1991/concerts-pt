name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: concerts
          POSTGRES_PASSWORD: concerts
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U concerts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://concerts:concerts@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build   # type-checks every package
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [api, migrate]   # add new services here
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t concerts-${{ matrix.service }} .
