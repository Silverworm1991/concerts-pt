name: concerts-pt

x-service: &service
  env_file: .env
  environment:
    DATABASE_URL: postgres://concerts:concerts@postgres:5432/concerts
    RABBITMQ_URL: amqp://concerts:concerts@rabbitmq:5672
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: concerts
      POSTGRES_PASSWORD: concerts
      POSTGRES_DB: concerts
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concerts"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: concerts
      RABBITMQ_DEFAULT_PASS: concerts
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *service
    build: { context: ., args: { SERVICE: api } }
    ports: ["3000:3000"]

volumes:
  pgdata:
